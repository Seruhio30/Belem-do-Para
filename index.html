<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belém do Pará</title>
    <link rel="stylesheet" href="belem.css">
</head>

<body>

    <main class="presentation">

        <section class="slide active" id="slide">
            <div class="top-bar">
                <p class="eyebrow" id="eyebrow">Apresentação</p>
                <p class="counter" id="counter">1 / 1</p>
            </div>

            <div class="content">
                <div class="text-area">
                    <h1 id="title">Belém do Pará</h1>
                    <p id="subtitle">Uma viagem pelo norte do Brasil</p>

                    <ul class="notes" id="notes">
                        <li>Introdução geral</li>
                    </ul>
                </div>

                <div class="image-area">
                    <img id="mainImage" src="assets/bandera-brasil.jpg" alt="Imagem da apresentação">

                    <div class="photo-controls" id="photoControls">
                        <button id="prevPhoto">← Foto</button>
                        <span id="photoCounter">1 / 1</span>
                        <button id="nextPhoto">Foto →</button>
                    </div>
                </div>
            </div>

            <div class="bottom-bar">
                <button id="prevSlide">← Voltar</button>
                <p>Dê click na tela ou use as setas do teclado</p>
                <button id="nextSlide">Próximo →</button>
            </div>
        </section>

    </main>

    <script src="belem.js"></script>
</body>

</html>
